<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Iron Log — Tracker Allenamenti</title>
<meta name="description" content="Traccia i tuoi allenamenti in palestra e ottieni report mensili con statistiche utili." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#14161B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Iron Log" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ============ AUTH VIEW ============ -->
<div id="auth-view">
  <div class="auth-hero">
    <h1 class="display">Registra ogni <em>ripetizione.</em><br/>Guarda i tuoi <em>progressi.</em></h1>
    <p>Accedi per tracciare i tuoi allenamenti e ricevere un report ogni mese.</p>
  </div>

  <div id="auth-error" class="auth-error hidden"></div>
  <div id="auth-note" class="auth-note hidden"></div>

  <form id="login-form">
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password" minlength="6" />
    </div>
    <button type="submit" class="btn btn-primary">Accedi</button>
  </form>

  <form id="signup-form" class="hidden">
    <div class="field">
      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="signup-password">Password (min. 6 caratteri)</label>
      <input type="password" id="signup-password" required autocomplete="new-password" minlength="6" />
    </div>
    <button type="submit" class="btn btn-primary">Crea account</button>
  </form>

  <div class="auth-switch">
    <span id="show-signup">Non hai un account? <b>Registrati</b></span>
    <span id="show-login" class="hidden">Hai già un account? <b>Accedi</b></span>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app-shell" class="hidden">

  <!-- DASHBOARD -->
  <section id="view-dashboard" class="view">
    <div class="top-bar">
      <div class="brand">IRON<span>LOG</span></div>
      <div class="today" id="today-label"></div>
    </div>

    <div class="stat-row" id="dash-stats"></div>

    <div class="section-title">
      Ultimi allenamenti
      <span class="link" data-nav="history">vedi tutti</span>
    </div>
    <div id="dash-recent"></div>
  </section>

  <!-- ADD WORKOUT -->
  <section id="view-add" class="view hidden">
    <div class="top-bar"><h2 class="display">Nuovo allenamento</h2></div>

    <form id="workout-form">
      <div class="field">
        <label>Categoria</label>
        <div class="chip-row" id="category-chips"></div>
      </div>

      <div class="field">
        <label for="w-exercise">Esercizio</label>
        <input type="text" id="w-exercise" placeholder="Es. Panca piana" required />
      </div>

      <div class="field">
        <label for="w-date">Data</label>
        <input type="date" id="w-date" required />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="w-sets">Serie</label>
          <input type="number" id="w-sets" min="0" placeholder="4" />
        </div>
        <div class="field">
          <label for="w-reps">Ripetizioni</label>
          <input type="number" id="w-reps" min="0" placeholder="10" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="w-weight">Peso (kg)</label>
          <input type="number" id="w-weight" min="0" step="0.5" placeholder="60" />
        </div>
        <div class="field">
          <label for="w-duration">Durata (min)</label>
          <input type="number" id="w-duration" min="0" placeholder="—" />
        </div>
      </div>

      <div class="field">
        <label for="w-notes">Note (opzionale)</label>
        <textarea id="w-notes" rows="2" placeholder="Sensazioni, tecnica, infortuni..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Salva allenamento</button>
    </form>
  </section>

  <!-- HISTORY -->
  <section id="view-history" class="view hidden">
    <div class="top-bar"><h2 class="display">Storico</h2></div>
    <div id="history-list"></div>
  </section>

  <!-- REPORT -->
  <section id="view-report" class="view hidden">
    <div class="top-bar"><h2 class="display">Report mensile</h2></div>

    <div class="month-switcher">
      <button id="prev-month">‹</button>
      <span class="month-label" id="month-label"></span>
      <button id="next-month">›</button>
    </div>

    <div id="report-content"></div>
  </section>

  <!-- PROFILE -->
  <section id="view-profile" class="view hidden">
    <div class="top-bar"><h2 class="display">Profilo</h2></div>
    <p class="muted" id="profile-email"></p>
    <div class="divider"></div>
    <button id="logout-btn" class="btn btn-ghost">Esci</button>
  </section>

  <button class="fab" id="fab-add">+</button>

  <nav class="bottom-nav">
    <button data-nav="dashboard" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      Home
    </button>
    <button data-nav="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Storico
    </button>
    <button data-nav="report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      Report
    </button>
    <button data-nav="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profilo
    </button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
